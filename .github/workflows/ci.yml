name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            wiki: true
          - os: ubuntu-latest
            python: "3.13"
            wiki: false
          - os: windows-latest
            python: "3.13"
            wiki: false
          - os: macos-latest
            python: "3.13"
            wiki: false
    runs-on: ${{ matrix.os }}
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install tshark (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tshark

      - name: install tshark (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install wireshark -y --no-progress
          "C:\Program Files\Wireshark" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: install tshark (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask wireshark
          echo "/Applications/Wireshark.app/Contents/MacOS" >> "$GITHUB_PATH"

      - name: install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest scapy pytest-cov

      - name: byte-compile
        run: python -m compileall -q PufferRelay

      - name: tests
        run: python -m pytest PufferRelay/tests -q

      - name: coverage report
        if: matrix.wiki
        run: python -m pytest PufferRelay/tests -q --cov=PufferRelay --cov-report=term

      - name: wiki catalog is current
        if: matrix.wiki
        run: python scripts/build_wiki.py --check
